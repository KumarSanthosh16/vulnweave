name: VulnWeave security gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate and test
        run: |
          pnpm check
          pnpm test
      - name: Install Semgrep
        run: pipx install semgrep
      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl --fail --location --silent --show-error "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Install OSV-Scanner
        run: |
          OSV_VERSION=2.5.1
          curl --fail --location --silent --show-error "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" -o /tmp/osv-scanner
          install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner
      - name: Install Trivy
        run: |
          TRIVY_VERSION=0.74.0
          curl --fail --location --silent --show-error "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
          curl --fail --location --silent --show-error "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt" -o /tmp/trivy_checksums.txt
          grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$" /tmp/trivy_checksums.txt | sed "s|  trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$|  /tmp/trivy.tar.gz|" | sha256sum --check --status
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          install -m 0755 /tmp/trivy /usr/local/bin/trivy
      - name: Run high-severity merge gate
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            pnpm cli -- . --changed-since "origin/${{ github.base_ref }}" --review-changes --format summary
          else
            pnpm cli -- . --format summary
          fi
      # This step deliberately runs even when the gate fails, so SARIF remains
      # available for triage and does not depend on an earlier build directory.
      - name: Build SARIF exporter
        id: sarif-build
        if: always()
        run: pnpm build
      - name: Export SARIF
        id: sarif-export
        if: always() && steps.sarif-build.outcome == 'success'
        run: node ./packages/cli/dist/index.js . --format sarif > vulnweave.sarif
      # Code Scanning must be enabled before private repositories can accept SARIF.
      # Keep the local artifact even when this optional GitHub integration is unavailable.
      - name: Publish SARIF to GitHub Code Scanning
        if: always() && steps.sarif-export.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: vulnweave.sarif
          category: vulnweave
      - name: Upload SARIF artifact
        if: always() && steps.sarif-export.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: vulnweave-sarif
          path: vulnweave.sarif
          if-no-files-found: error
